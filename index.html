<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPG Application</title>
    <script>
        var miles = prompt("Enter miles driven");
        miles = parseFloat(miles);
        var gallons = prompt("Enter gallons of gas used");
        gallons = parseFloat(gallons);
        var mpg = miles/gallons;
        mpg = parseInt(mpg);
        document.write(
            "<h1>Calculate Miles Per Gallon</h1>" + "<br>" +
            "Miles driven = " + miles + "<br>" +
            "Gallons used = " + gallons + "<br>" + "<br>" +
            "Miles per gallon = " + mpg
            );
    </script>
</head>
<body>
   <p>Thanks for using the MPG Application.</p>
</body>
</html>
