<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPG Application</title>
    <link rel="stylesheet" href="style.css">
    <script>
        "use strict"
        var $ = function (id) {
            return document.getElementById(id);
        };

        var calculateMPG = function (miles, gallons) {
            var mpg = miles / gallons;
            mpg = mpg.toFixed(1);
            return mpg;
        };

        var processEntries = function () {
            var miles = parseFloat($("miles").value);
            var gallons = parseFloat($("gallons").value);
            var isValid = true;
            if (isNaN(miles)) {
                $("miles_error").firstChild.nodeValue = " Must be valid number."
                isValid = false;
            } else if (miles <= 0) {
                $("miles_error").firstChild.nodeValue = " Must be greater than 0."
                isValid = false;
            } else {
                $("miles_error").firstChild.nodeValue = "";
            }
            if (isNaN(gallons)) {
                $("gallons_error").firstChild.nodeValue = " Must be valid number."
                isValid = false;
            } else if(gallons <= 0) {
                $("gallons_error").firstChild.nodeValue = " Must be greater than 0."
                isValid = false;
            } else {
                $("gallons_error").firstChild.nodeValue = "";
            }
            if(isValid) {
                $("mpg").value = calculateMPG(miles, gallons);
            }
        };


        window.onload = function () {
            $("calculate").onclick = processEntries;
            $("miles").focus();
        }



    </script>
</head>

<body>
    <main>
        <h1>Calculate Miles Per Gallon</h1>
        <label for="miles">Miles Driven:</label>
        <input type="text" id="miles">
        <span id="miles_error">*</span>
        <br>
        <label for="gallons">Gallons used:</label>
        <input type="text" id="gallons">
        <span id="gallons_error">*</span>
        <br>
        <label for="mpg">Miles Per Gallon:</label>
        <input type="text" id="mpg" disabled>
        <br>
        <label for="calculate">&nbsp;</label>
        <input type="button" id="calculate" value="Calculate MPG">
    </main>

</body>

</html>
