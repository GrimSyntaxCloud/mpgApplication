<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPG Application</title>
    <link rel="stylesheet" href="style.css">
    <script>
        "use strict"
        var $ = function (id) {
            return document.getElementById(id);
        };

        var calculateMPG = function (miles, gallons) {
            var mpg = miles / gallons;
            mpg = mpg.toFixed(1);
            return mpg;
        };

        var processEntries = function() {
            var miles = parseFloat($("miles").value);
            var gallons = parseFloat($("gallons").value);
            if(isNaN(miles) || isNaN(gallons)) {
                alert("Must use numbers");
            }
            else {
                $("mpg").value = calculateMPG(miles,gallons);
            }
        };


        window.onload = function() {
            $("calculate").onclick = processEntries;
            $("miles").focus();
        }



    </script>
</head>

<body>
    <main>
        <h1>Calculate Miles Per Gallon</h1>
        <label for="miles">Miles Driven:</label>
        <input type="text" id="miles">
        <br>
        <label for="gallons">Gallons used:</label>
        <input type="text" id="gallons">
        <br>
        <label for="mpg">Miles Per Gallon:</label>
        <input type="text" id="mpg" disabled>
        <br>
        <label for="calculate">&nbsp;</label>
        <input type="button" id="calculate" value="Calculate MPG">
    </main>

</body>

</html>
